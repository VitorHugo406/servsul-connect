plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def ksFile = System.getenv('EWVON_KEYSTORE')
android {
    namespace 'br.com.ewvon.app'
    compileSdk 34
    defaultConfig {
        applicationId 'br.com.ewvon.app'
        minSdk 23
        targetSdk 34
        versionCode 14
        versionName '2.1.1'
    }
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('EWVON_KS_PASS')
                keyAlias 'ewvon'
                keyPassword System.getenv('EWVON_KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
